<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 | IT 개발 · 자문/감리 · 정보보안</title>
<meta name="description" content="소프트웨어 개발, 정보시스템 자문/감리, 정보보안 전문가 포트폴리오">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <span class="nav-brand">Portfolio</span>

    <div class="nav-right">
      <div class="controls">
        <div class="font-size-group" role="group" aria-label="글자 크기 조절">
          <button type="button" class="font-btn" data-size="sm" aria-label="작게" title="작게">가</button>
          <button type="button" class="font-btn active" data-size="md" aria-label="보통" title="보통">가</button>
          <button type="button" class="font-btn" data-size="lg" aria-label="크게" title="크게">가</button>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="다크/라이트 모드 전환" title="다크/라이트 모드 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path></svg>
        </button>
      </div>

      <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a href="#about">소개</a></li>
        <li><a href="#career">경력</a></li>
        <li><a href="#projects">프로젝트</a></li>
        <li><a href="#education">학력</a></li>
        <li><a href="#certs">자격증</a></li>
        <li><a href="#guestbook">방명록</a></li>
      </ul>
    </div>
  </nav>
</header>

<main>
  <section class="hero container" id="about">
    <p class="hero-eyebrow">IT PROFESSIONAL</p>
    <h1 id="heroName">OOO</h1>
    <p class="hero-role" id="heroRole"></p>
    <p class="hero-summary" id="heroSummary"></p>
    <div class="hero-stats" id="heroStats"></div>
  </section>

  <section class="section" id="career">
    <div class="container">
      <h2 class="section-title">경력</h2>
      <p class="section-sub">Career</p>
      <div class="timeline" id="careerTimeline"></div>
    </div>
  </section>

  <section class="section section-alt" id="projects">
    <div class="container">
      <h2 class="section-title">프로젝트</h2>
      <p class="section-sub">Projects</p>
      <div class="project-filters" id="projectFilters"></div>
      <div class="project-list" id="projectList"></div>
    </div>
  </section>

  <section class="section" id="education">
    <div class="container">
      <h2 class="section-title">학력</h2>
      <p class="section-sub">Education</p>
      <div id="educationList"></div>
    </div>
  </section>

  <section class="section section-alt" id="certs">
    <div class="container">
      <h2 class="section-title">자격증</h2>
      <p class="section-sub">Certifications</p>
      <div class="cert-grid" id="certGrid"></div>
    </div>
  </section>

  <section class="section" id="guestbook">
    <div class="container">
      <h2 class="section-title">방명록</h2>
      <p class="section-sub">Guestbook</p>

      <form class="guestbook-form" id="guestbookForm">
        <div class="guestbook-form-row">
          <input type="text" id="guestbookName" name="name" placeholder="이름" maxlength="30" required>
        </div>
        <textarea id="guestbookMessage" name="message" placeholder="메시지를 남겨주세요" maxlength="300" rows="3" required></textarea>
        <div class="guestbook-form-footer">
          <span class="guestbook-status" id="guestbookStatus"></span>
          <button type="submit" class="guestbook-submit" id="guestbookSubmit">남기기</button>
        </div>
      </form>

      <div class="guestbook-list" id="guestbookList">
        <p class="guestbook-empty" id="guestbookEmpty">방명록을 불러오는 중...</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="year"></span> Portfolio. Built with HTML / CSS / JS.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/guestbook.js"></script>
</body>
</html>
